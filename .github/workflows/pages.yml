name: Publish to GitHub Pages

# Pages serves the gh-pages branch (enabled 2026-08-06); this workflow
# mirrors the dev branch into it. Run it manually from the Actions tab
# after merging changes, or let the push trigger handle it.

on:
  push:
    branches: [claude/creative-project-sandbox-yzeavw]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: git push --force origin HEAD:gh-pages
